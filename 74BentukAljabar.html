				function SplitString(ff){
					var gg = new Array();
					var strff = ""+ff;
					var len = strff.length;
					for (var i=0; i<len; i++){
						gg.push(strff.substr(i,1));
					}
					return gg;
				}
				function StringRibuan(str){
					var strfix = "";
					var arfix = new Array();
					var StrArray = SplitString(str);
					for (var i=0; i<StrArray.length; i++){
						arfix.push(StrArray[i]);
					}
					var ct = 0;
					var m = 0;
					var n = 0;
					var ctmax = StrArray.length;
					var arct = new Array();
					for (var i=StrArray.length-1; i>=0; i--){
						ct++;
						ctmax--;
						if(ct==3){
							ct = 0;
							m++;
							arct.push(3);
						}
					}
					var n = StrArray.length - 3*arct.length;
					var iter=-1;
					strfix="";
					for (var i=0; i<n; i++){
						iter++;
						strfix += arfix[iter];
					}
					if (n>0)
						strfix += ".";
					for (var i=0; i<m; i++){
						for (j=0; j<3; j++){
							iter++;
							strfix += arfix[iter];
						}
						strfix += ".";
					}
					var leng = strfix.length;
					strfix = strfix.substr(0, leng-1);
					return strfix
				}
				function Mods(m,n){
					var m0b = m;
					var m0 = m;
					var ct = 0;
					do{
						m0b = m0;
						m0-=n;
						ct++;
					}while(m0>=0);
					
					var sisa = Math.abs(m0b);
					return sisa;
				}
				function BilanganPrimaMaksN(p){
					ArrPrime = new Array();
					for(m=2; m<=p; m++){
						f = CekPrimaN(m)==1;
						if (f){
							ArrPrime.push(m);
						}
					}
					return ArrPrime;
				}
				function CekPrimaN(a) {
					//https://www.autohotkey.com/board/topic/47325-isprime-check-if-number-is-prime/
					//Laszlo
					//Moderators
					//4713 posts
					//Metode dengan akar dan pembulatan ke bawah
					
					for(var i=1;i<=Math.floor(Math.sqrt(a)-1);i++){
						var f = Mods(a,i+1);
						if(!f){
							return 0;
						}
					}
					
					return 1;
				}
				function APangkatN(a,n){
					var num = 1;
					for(var i=1;i<=n;i++){
						num *= a;
					}
					return num;
				}

				function Maksimum(ar){
					var max = ar[0];
					for(var i=1;i<ar.length;i++){
						if(max < ar[i]){
							max = ar[i];
						}
					}
					return max;
				}
				function Minimum(ar){
					var mini = ar[0];
					for(var i=1;i<ar.length;i++){
						if(mini > ar[i]){
							mini = ar[i];
						}
					}
					return mini;
				}
				function CariFPB(ar){
					//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
					
					var min = 0;
					var max = 0;
					for(var i=0;i<ar.length;i++){
						min = Math.min(min,ar[i]);
						max = Math.max(max,ar[i]);
					}
					
					var iter = 0;
					var fpb = 1;
					var f = [];
					do {
						iter++;
						ff = 1;
						for(var i=0;i<ar.length;i++){
							f[i] = Mods(ar[i],iter)==0;
							ff *= f[i];
						}
						
						if (ff){
							fpb = iter;
						}
						fakhir = iter==max;
					}while (!fakhir);
					
					return fpb;
				}

				function arraysAreEqual(arr1, arr2) {
					if (arr1.length !== arr2.length) {
					   return false;
					}
					return arr1.every((val, index) => val === arr2[index]);
				}

					base3_image.src = arrs[4];
					base4_image.src = arrs[5];

						CekJaw();
					}
					base2_image.onload = function () {
						CekJaw();
					}
					base3_image.onload = function () {
						CekJaw();
					}
					base4_image.onload = function () {
						CekJaw();
					}
					var inside=0;
					function CekJaw(){
						inside++;
						if(inside==4){

								var Abjad = ["A","B","C","D"];
								ctx.font = "16px Times New Roman";
								ctx.textAlign = "center";
								
								if(i==0) 		ctx.drawImage(base1_image, 0, 50*i,base1_image.width, base1_image.height);
								else if(i==1) 	ctx.drawImage(base2_image, 0, 50*i,base2_image.width, base2_image.height);

								ctx.fillText(Abjad[i]+".",0,22+50*i);
							}
						}
					}
					
					return 0;
				}
