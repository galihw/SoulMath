			function Print73(no,d1,c1,d2,c2,d3,c3,d4,nourut){
				function RandomMyArray(Arr){
					for (var i=0; i<Arr.length; i++){
						var r = Math.floor(Math.random() * Arr.length);
						var a = Arr[i];
						Arr[i] = Arr[r];
						Arr[r] = a;
					}
					return Arr
				}
				function NoJawabanBenar(Arr, jwb){
					for (var i=0; i<Arr.length; i++){
						if (Arr[i]==jwb){
							return i;
							break;
						}
					}
				}
				function GetABCD(no){
					var ABCD = ["A","B","C","D"]
					return ABCD[no]
				}
				function RandomAngkaAtoB(a,b){ 
					var r = a+Math.ceil(Math.random() * b);
					return r;
				}
				function RandomBeberapaAngka(n,a,b){
					aa = [];
					for(var i=0; i<n; i++){
						aa.push(RandomAngkaAtoB(a,b));
					}
					return aa;
				}
				function SplitString(ff){
					var gg = new Array();
					var strff = ""+ff;
					var len = strff.length;
					for (var i=0; i<len; i++){
						gg.push(strff.substr(i,1));
					}
					return gg;
				}
				function StringRibuan(str){
					var strfix = "";
					var arfix = new Array();
					var StrArray = SplitString(str);
					for (var i=0; i<StrArray.length; i++){
						arfix.push(StrArray[i]);
					}
					var ct = 0;
					var m = 0;
					var n = 0;
					var ctmax = StrArray.length;
					var arct = new Array();
					for (var i=StrArray.length-1; i>=0; i--){
						ct++;
						ctmax--;
						if(ct==3){
							ct = 0;
							m++;
							arct.push(3);
						}
					}
					var n = StrArray.length - 3*arct.length;
					var iter=-1;
					strfix="";
					for (var i=0; i<n; i++){
						iter++;
						strfix += arfix[iter];
					}
					if (n>0)
						strfix += ".";
					for (var i=0; i<m; i++){
						for (j=0; j<3; j++){
							iter++;
							strfix += arfix[iter];
						}
						strfix += ".";
					}
					var leng = strfix.length;
					strfix = strfix.substr(0, leng-1);
					return strfix
				}
				function Mods(m,n){
					var m0b = m;
					var m0 = m;
					var ct = 0;
					do{
						m0b = m0;
						m0-=n;
						ct++;
					}while(m0>=0);
					
					var sisa = Math.abs(m0b);
					return sisa;
				}
				function BilanganPrimaMaksN(p){
					ArrPrime = new Array();
					for(m=2; m<=p; m++){
						f = CekPrimaN(m)==1;
						if (f){
							ArrPrime.push(m);
						}
					}
					return ArrPrime;
				}
				function CekPrimaN(a) {
					//https://www.autohotkey.com/board/topic/47325-isprime-check-if-number-is-prime/
					//Laszlo
					//Moderators
					//4713 posts
					//Metode dengan akar dan pembulatan ke bawah
					
					for(var i=1;i<=Math.floor(Math.sqrt(a)-1);i++){
						var f = Mods(a,i+1);
						if(!f){
							return 0;
						}
					}
					
					return 1;
				}
				function APangkatN(a,n){
					var num = 1;
					for(var i=1;i<=n;i++){
						num *= a;
					}
					return num;
				}
				function NamaPulauIndonesia(){
					var Ar = ["Jawa","Sumatera","Sulawesi","Kalimantan","Papua","Riau","Maluku","Sumbawa","Flores"];
					Ar = RandomMyArray(Ar)
					return Ar
				}
				function Maksimum(ar){
					var max = ar[0];
					for(var i=1;i<ar.length;i++){
						if(max < ar[i]){
							max = ar[i];
						}
					}
					return max;
				}
				function Minimum(ar){
					var mini = ar[0];
					for(var i=1;i<ar.length;i++){
						if(mini > ar[i]){
							mini = ar[i];
						}
					}
					return mini;
				}
				function CariFPB(ar){
					//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
					
					var min = 0;
					var max = 0;
					for(var i=0;i<ar.length;i++){
						min = Math.min(min,ar[i]);
						max = Math.max(max,ar[i]);
					}
					
					var iter = 0;
					var fpb = 1;
					var f = [];
					do {
						iter++;
						ff = 1;
						for(var i=0;i<ar.length;i++){
							f[i] = Mods(ar[i],iter)==0;
							ff *= f[i];
						}
						
						if (ff){
							fpb = iter;
						}
						fakhir = iter==max;
					}while (!fakhir);
					
					return fpb;
				}
				function StringDesimal(ff){
					var strff = ""+ff;
					const gg = strff.split(".");
					if(gg.length==2)	return gg[0]+","+gg[1];
					else 				return ff
				}

				function GetSoal23(canv){

					if(x2<0)	cetakx2 = "\u{2212}"+Math.abs(x2)

					for(var i=-10;i<=10;i++){
						if(i!==0) ar_er.push(i);
					}

						if(Ar[i]<0) Ar[i]="\u{2212}"+Math.abs(Ar[i]);

				}
				function GetSoal22(){
					var angka = [1,2,3,4,5,6,7,8,9];
					angka = RandomMyArray(angka);
					var skala = 100000*angka[0];
					var sp = 6*angka[1];
					var vv = 10*angka[0];
					
					var ss = sp*skala/100000;
					var ttJ = Math.floor(ss/vv);
					var ttM = Math.round((ss/vv-ttJ)*60);
					//console.log(ss,vv,ttJ,ttM)
					//console.log(ss/vv)
					
					var arrrehat = [15,30,45];
					arrrehat = RandomMyArray(arrrehat);
					var trehat = arrrehat[0];
					
					var jawab = JM(ttJ,ttM,trehat,0);
					
					function JM(inj,inm,inmrehat,inerr){
						var j1 = 7;
						var m1 = 0;
						var j2 = 0;
						var m2 = inmrehat+inerr;
						var j3 = inj;
						var m3 = inm;
						
						var addJ = 0;
						var MM = m1 + m2 + m3;
						if(MM<10){ 
							MM = "0"+MM;
						}else{
							if(MM>60){
								addJ = Math.floor(MM/60);
								MM = MM%60;
								if(MM<10){ 
									MM = "0"+MM;
								}
							}
						}
						
						var JJ = j1 + j2 + j3 + addJ;
						if(JJ<10) JJ = "0"+JJ;
						
						var JMfix = JJ+":"+MM;
						return JMfix;
					}
					
					
					//console.log(jawab)
					
					var aa2 = 100;
					var ct = 1;
					
					var ss = "Sebuah peta dibuat dengan skala 1 : "+StringRibuan(skala)+". ";

					ss += "Siti mengendarai motor dari kota A menuju B dengan kecepatan rata rata "+vv+" km/jam. ";

					ss += "maka ia akan tiba di kota B pada pukul ...";
					
					var ar_er = [];
					for(var i=-10;i<=10;i++){
						if(i!==0) ar_er.push(i);
					}
					
					var Ar = [];
					ar_er = RandomMyArray(ar_er);
					Ar[0] = jawab;
					Ar[1] = JM(ttJ,ttM,trehat,ar_er[0]);
					Ar[2] = JM(ttJ,ttM,trehat,ar_er[1]);
					Ar[3] = JM(ttJ,ttM,trehat,ar_er[2]);
					
					var jawab = Ar[0];
					
					Ar = RandomMyArray(Ar);
					
					var noBenar = NoJawabanBenar(Ar, jawab);
					var textSoal = ss+" <p>A. "+Ar[0]+" <br>B. "+Ar[1]+" <br>C. "+Ar[2]+" <br>D. "+Ar[3]+"</p>";
					
					ArFix = [];
					ArFix.push(textSoal);
					ArFix.push(GetABCD(noBenar));
					
					return ArFix;
				}

				function GetSoal10(canv){
					var aa = 1;
					var bb = 2;
					var cc = 1;
					var dd = 3;
					var ee = 2;
					var ct = 1;//RandomAngkaAtoB(0,4);
					var skl = 100*RandomAngkaAtoB(0,10);
					
					var desa = aa*ct;
					var desb = bb*ct;
					var desc = cc*ct;
					var desd = dd*ct;
					var dese = ee*ct;
					
					var lbr = desa + desb;
					var pjg = desc + desd + dese;
					
					var pjgs = pjg*skl/100;
					var lbrs = lbr*skl/100;
					var luas = pjgs * lbrs;
					
					const DrawPenyajian = GambarRasio10(canv,[desa,desb,desc,desd,dese,"Skala = 1 : "+StringRibuan(skl)]);
					
					var ss = "Luas kantor sebenarnya adalah ... "
					
					var arsalah = [];
					arsalah[0] = pjg*lbr*100;
					arsalah[1] = pjg*pjg*100;
					arsalah[2] = lbr*lbr*100;
					arsalah[3] = pjgs*pjgs
					arsalah[4] = lbrs*lbrs
					arsalah[5] = pjgs*lbr*100;
					arsalah[6] = pjg*lbrs*100;
					arsalah = RandomMyArray(arsalah);
					
					var Ar = [];
					Ar[0] = luas;
					Ar[1] = arsalah[0];
					Ar[2] = arsalah[1];
					Ar[3] = arsalah[2];
					for(var i=0;i<4;i++){
						Ar[i]=StringRibuan(Ar[i]);
					}
					
					var jawab = Ar[0];
					Ar = RandomMyArray(Ar);
					
					var noBenar = NoJawabanBenar(Ar, jawab);
					var textSoal = ss+" <p>A. "+Ar[0]+" m\u{00B2}<br>B. "+Ar[1]+" m\u{00B2}<br>C. "+Ar[2]+" m\u{00B2}<br>D. "+Ar[3]+" m\u{00B2}</p>";
					
					var ArFix = [];
					ArFix.push(textSoal);
					ArFix.push(GetABCD(noBenar));
					
					return ArFix;
				}
