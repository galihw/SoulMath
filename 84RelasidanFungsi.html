				function RandomMyArray(Arr){
					for (var i=0; i<Arr.length; i++){
						var r = Math.floor(Math.random() * Arr.length);
						var a = Arr[i];
						Arr[i] = Arr[r];
						Arr[r] = a;
					}
					return Arr
				}

					for (var i=0; i<Arr.length; i++){

					var ABCD = ["A","B","C","D"]
					return ABCD[no]

				function RandomAngkaAtoB(a,b){ 
					var r = a+Math.ceil(Math.random() * b);
					return r;

				function RandomBeberapaAngka(n,a,b){
					aa = [];

				function SplitString(ff){
					var gg = new Array();
					var strff = ""+ff;
					var len = strff.length;
					for (var i=0; i<len; i++){
						gg.push(strff.substr(i,1));
					}
					return gg;
				}
				function StringRibuan(str){
					var strfix = "";
					var arfix = new Array();
					var StrArray = SplitString(str);
					for (var i=0; i<StrArray.length; i++){
						arfix.push(StrArray[i]);
					}
					var ct = 0;
					var m = 0;
					var n = 0;
					var ctmax = StrArray.length;
					var arct = new Array();
					for (var i=StrArray.length-1; i>=0; i--){
						ct++;
						ctmax--;
						if(ct==3){
							ct = 0;
							m++;
							arct.push(3);
						}
					}
					var n = StrArray.length - 3*arct.length;
					var iter=-1;
					strfix="";
					for (var i=0; i<n; i++){
						iter++;
						strfix += arfix[iter];
					}
					if (n>0)
						strfix += ".";
					for (var i=0; i<m; i++){
						for (j=0; j<3; j++){
							iter++;
							strfix += arfix[iter];
						}
						strfix += ".";
					}
					var leng = strfix.length;
					strfix = strfix.substr(0, leng-1);
					return strfix
				}
				function Mods(m,n){
					var m0b = m;
					var m0 = m;
					var ct = 0;
					do{
						m0b = m0;
						m0-=n;
						ct++;
					}while(m0>=0);
					
					var sisa = Math.abs(m0b);
					return sisa;
				}
				function BilanganPrimaMaksN(p){
					ArrPrime = new Array();
					for(m=2; m<=p; m++){
						f = CekPrimaN(m)==1;
						if (f){
							ArrPrime.push(m);
						}
					}
					return ArrPrime;
				}
				function CekPrimaN(a) {
					//https://www.autohotkey.com/board/topic/47325-isprime-check-if-number-is-prime/
					//Laszlo
					//Moderators
					//4713 posts
					//Metode dengan akar dan pembulatan ke bawah
					
					for(var i=1;i<=Math.floor(Math.sqrt(a)-1);i++){
						var f = Mods(a,i+1);
						if(!f){
							return 0;
						}
					}
					
					return 1;
				}
				function APangkatN(a,n){
					var num = 1;
					for(var i=1;i<=n;i++){
						num *= a;
					}
					return num;
				}
				function NamaPulauIndonesia(){
					var Ar = ["Jawa","Sumatera","Sulawesi","Kalimantan","Papua","Riau","Maluku","Sumbawa","Flores"];
					Ar = RandomMyArray(Ar)
					return Ar
				}
				function Maksimum(ar){
					var max = ar[0];
					for(var i=1;i<ar.length;i++){
						if(max < ar[i]){
							max = ar[i];
						}
					}
					return max;
				}
				function Minimum(ar){
					var mini = ar[0];
					for(var i=1;i<ar.length;i++){
						if(mini > ar[i]){
							mini = ar[i];
						}
					}
					return mini;
				}
				function CariFPB(ar){
					//https://www.ketutrare.com/2019/05/contoh-aplikasi-fpb-dan-kpk-menggunakan-bahasa-c.html
					
					var min = 0;
					var max = 0;
					for(var i=0;i<ar.length;i++){
						min = Math.min(min,ar[i]);
						max = Math.max(max,ar[i]);
					}
					
					var iter = 0;
					var fpb = 1;
					var f = [];
					do {
						iter++;
						ff = 1;
						for(var i=0;i<ar.length;i++){
							f[i] = Mods(ar[i],iter)==0;
							ff *= f[i];
						}
						
						if (ff){
							fpb = iter;
						}
						fakhir = iter==max;
					}while (!fakhir);
					
					return fpb;
				}

				function arraysAreEqual(arr1, arr2) {
					if (arr1.length !== arr2.length) {
					   return false;
					}
					return arr1.every((val, index) => val === arr2[index]);
				}

				function GetSoal15(){

					batas = RandomMyArray(batas);
					var aa = angka[0];
					var bb = angka[1];
					var xx1 = batas[0];
					var xx2 = batas[1];
						
					var benar = ArHasil(xx1,xx2,aa,bb);
					
					function fx(x,a,b){
						return a*x-b;
					}
					function Deret(arr){
						var str = "{"
						for(var i=0;i<arr.length;i++){
							var nn = arr[i];
							if(nn<0)	nn = "\u{2212}"+Math.abs(nn);
							if(i==0)	str+=nn
							else		str+=", "+nn
						}
						str+="}";
						return str;
					}
					
					function ArHasil(x1,x2,a,b){
						var arr = []
						for(var i=-x1;i<=x2;i++){
							var res = fx(i,a,b) 
							arr.push(res);
						}
						arr = SortAtoZ(arr);
						var str = Deret(arr);
						return str;
					}
					
					var ss = "Suatu fungsi didefinisikan sebagai f(x) = "+aa+"x \u{2212} "+bb+". <br>";
					ss += "Bila daerah asal {x|\u{2212}"+xx1+" \u{2264} x \u{2264} "+xx2+", x \u{220A} B}, maka daerah hasil adalah...</p>";

					Ar[3] = ArHasil(xx1-ar_er[2],xx2+ar_er[2],aa,bb);
					
					
					var jawab = Ar[0];

					var noBenar = NoJawabanBenar(Ar, jawab);
					var textSoal = ss+" <p>A. "+Ar[0]+" <br>B. "+Ar[1]+" <br>C. "+Ar[2]+" <br>D. "+Ar[3]+"</p>";
					
					var ArFix = [];
					ArFix.push(textSoal);

				}

					var dd = angka[3];
					var ee = angka[4];
					var ff = angka[5];
					var gg = angka[6];
					
					var arrS = []

					arrS[1] = Arrays(bb,cc);
					arrS[2] = Arrays(dd,-ee);
					arrS[3] = Arrays(ff,-gg);

					//c.	f(x)=4x−2

								["f(x) = "+dd+"x \u{2212} "+ee, arrS[2]],
								["f(x) = "+ff+"x \u{2212} "+gg, arrS[3]]
								]
					
					arrT = RandomMyArray(arrT);
					
					var arrF = [].concat(arrT);
					do{
						arrF = RandomMyArray(arrF);
						var ft = arrT[0][0]!==arrF[0][0];
					}while(ft)

						var nar = [3,5,6];
						for(var i=0;i<3;i++){
							ar[i] = fxab(nar[i],a,b);
						}
						return ar;
					}

					}
